name: Continuous Integration

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main, development]
  workflow_dispatch: {}

# Cancela ejecuciones viejas del mismo ref: si llega un push nuevo, el anterior no bloquea.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  backend-unit-tests:
    runs-on: [self-hosted, linux, x64, ics-wsl]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          # En runners self-hosted Linux el default del action es /usr/share/dotnet,
          # que requiere root. El tool cache del runner siempre es escribible.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ICS_TPI2026_backend/*/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restaurar paquetes
        working-directory: ICS_TPI2026_backend
        run: dotnet restore Dsw2025Tpi.sln

      - name: Ejecutar pruebas unitarias
        run: bash scripts/ci/run-dotnet-tests.sh Unit unit

      - name: Publicar resultados unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-results
          path: ICS_TPI2026_backend/TestResults
          retention-days: 7

  backend-integration-tests:
    runs-on: [self-hosted, linux, x64, ics-wsl]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ICS_TPI2026_backend/*/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restaurar paquetes
        working-directory: ICS_TPI2026_backend
        run: dotnet restore Dsw2025Tpi.sln

      - name: Ejecutar pruebas de integracion (SQLite)
        run: bash scripts/ci/run-dotnet-tests.sh Integration integration

      - name: Publicar resultados de integracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results
          path: ICS_TPI2026_backend/TestResults
          retention-days: 7

  # Newman corre sobre ubuntu-latest porque necesita Docker para levantar SQL Server.
  # El runner self-hosted de WSL no tiene Docker disponible.
  backend-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Credencial efimera del runner: se deriva del run para no versionar secretos.
          MSSQL_SA_PASSWORD: "Ci${{ github.run_id }}!Sql2026"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci${{ github.run_id }}!Sql2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
      ConnectionStrings__Dsw2025Tpi: "Server=localhost,1433;Database=Dsw2025Tpi;User Id=sa;Password=Ci${{ github.run_id }}!Sql2026;TrustServerCertificate=True;"
      Jwt__Key: "ci-${{ github.run_id }}-signing-key-tp4-ics-2026"
      Jwt__Issuer: Dsw2025Tpi.Api
      Jwt__Audience: Dsw2025Tpi.Client
      DefaultAdminUser__UserName: admin
      DefaultAdminUser__Email: admin@example.com
      DefaultAdminUser__Password: "Admin${{ github.run_id }}!Tp4"
      DefaultAdminUser__Role: Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ICS_TPI2026_backend/*/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Compilar la API
        run: dotnet build ICS_TPI2026_backend/Dsw2025Tpi.Api/Dsw2025Tpi.Api.csproj -c Release

      - name: Levantar la API contra SQL Server
        run: |
          dotnet run --project ICS_TPI2026_backend/Dsw2025Tpi.Api --no-build -c Release --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5080/healthcheck; then
              echo "API lista"
              exit 0
            fi
            sleep 2
          done
          echo "::error::La API no respondio el healthcheck"
          cat api.log
          exit 1

      - name: Instalar Newman
        working-directory: tests/e2e
        run: npm ci

      - name: Ejecutar pruebas E2E
        working-directory: tests/e2e
        run: npm run test:e2e

      - name: Log de la API
        if: failure()
        run: cat api.log

      - name: Publicar resultados E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-results
          path: |
            tests/e2e/results
            api.log
          retention-days: 7

  backend-build:
    needs: [backend-unit-tests, backend-integration-tests, backend-e2e-tests]
    runs-on: [self-hosted, linux, x64, ics-wsl]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ICS_TPI2026_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Dsw2025Tpi.sln
      - run: dotnet build Dsw2025Tpi.sln --no-restore -c Release /p:TreatWarningsAsErrors=true

  # Se mantiene en un runner de GitHub hasta habilitar Docker dentro de WSL.
  # En un repositorio publico estos minutos no se facturan.
  docker-build:
    needs: [backend-unit-tests, backend-integration-tests, backend-e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ICS_TPI2026_backend/Dockerfile -t ics-api:ci ICS_TPI2026_backend

  frontend-build:
    runs-on: [self-hosted, linux, x64, ics-wsl]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ICS_TPI2026_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ICS_TPI2026_frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint:
    runs-on: [self-hosted, linux, x64, ics-wsl]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ICS_TPI2026_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ICS_TPI2026_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0

  branch-name-check:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, ics-wsl]
    timeout-minutes: 5
    steps:
      - run: |
          echo "Head ref: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" == "development" || "${{ github.head_ref }}" == "main" ]]; then
            echo "Rama principal detectada - branch check omitido."
            exit 0
          fi
          if ! [[ "${{ github.head_ref }}" =~ ^(feature/|feat/|fix/|hotfix/|bugfix/|release/|docs/|chore/|refactor/|test/) ]]; then
            echo "Nombre de rama no permitido. Usa feature/*, feat/*, fix/*, hotfix/*, bugfix/*, release/*, docs/*, chore/*, refactor/* o test/*."
            exit 1
          fi

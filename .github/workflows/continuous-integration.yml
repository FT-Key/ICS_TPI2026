name: Continuous Integration

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch: {}

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICS_TPI2026_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Dsw2025Tpi.sln
      - run: dotnet build Dsw2025Tpi.sln --no-restore -c Release /p:TreatWarningsAsErrors=true

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ICS_TPI2026_backend/Dockerfile -t ics-api:ci ICS_TPI2026_backend

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICS_TPI2026_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ICS_TPI2026_frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ICS_TPI2026_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ICS_TPI2026_frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0

  branch-name-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Head ref: ${{ github.head_ref }}"
          if ! [[ "${{ github.head_ref }}" =~ ^(feature/|feat/|fix/|hotfix/|bugfix/|release/|docs/|chore/|refactor/) ]]; then
            echo "Nombre de rama no permitido. Usa feature/*, feat/*, fix/*, hotfix/*, bugfix/*, release/*, docs/*, chore/* o refactor/*."
            exit 1
          fi
